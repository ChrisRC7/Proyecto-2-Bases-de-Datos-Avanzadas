# Plataforma distribuida de anotación de datos — Proyecto 2
#
# Redes:
#   interna -> todos los servicios y motores de datos (sin puertos al host).
#   borde   -> solo gateway (y el simulador, que solo puede hablar con el gateway).
# El gateway es el único componente publicado en el host (puerto 8000).
#
# Perfiles:
#   (sin perfil) -> plataforma completa con 1 worker de Spark.
#   spark2       -> agrega el segundo worker de Spark (comparación 1 vs 2 workers).
#   carga        -> contenedor del simulador para pruebas de carga.

name: proyecto2

x-servicio-python: &servicio-python
  restart: unless-stopped
  networks: [interna]
  healthcheck:
    test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(f'http://localhost:{os.environ[\"PUERTO\"]}/salud', timeout=2)"]
    interval: 10s
    timeout: 3s
    retries: 3

services:
  gateway:
    <<: *servicio-python
    build: ./servicios/gateway
    ports:
      - "8000:8000"
    networks: [interna, borde]
    environment:
      SERVICIO: gateway
      PUERTO: "8000"
      REGISTRO_URL: http://registro:8001
      SESION_URL: http://sesion:8002
      HISTORIAL_URL: http://historial:8003
      ANALITICA_URL: http://analitica:8004
    # Sin "condition": el gateway debe arrancar y responder /salud aunque otra capa esté caída.
    depends_on: [registro, sesion, historial, analitica]

  registro:
    <<: *servicio-python
    build: ./servicios/registro
    environment:
      SERVICIO: registro
      PUERTO: "8001"
      # Solo MongoDB: el registro no tiene la dirección de ningún Valkey.
      MONGO_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0
      MONGO_DB: plataforma
      MONGO_W: ${MONGO_W:-majority}
      SESION_URL: http://sesion:8002

  sesion:
    <<: *servicio-python
    build: ./servicios/sesion
    environment:
      SERVICIO: sesion
      PUERTO: "8002"

  historial:
    <<: *servicio-python
    build: ./servicios/historial
    # Con el usuario del host, para que los Parquet de datalake/ no queden a nombre de root.
    user: "${UID:-1000}:${GID:-1000}"
    networks: [interna, cola]  # único servicio que ve a cola-eventos
    environment:
      SERVICIO: historial
      PUERTO: "8003"
      COLA_HOST: cola-eventos
      COLA_PUERTO: "6379"
      LAGO_DIR: /datalake
      SESION_URL: http://sesion:8002
      MICRO_LOTE_EVENTOS: "500"
      MICRO_LOTE_SEGUNDOS: "5"
    volumes:
      - ./datalake:/datalake  # lectura/escritura solo aquí (C1.2)
    depends_on: [cola-eventos]

  analitica:
    <<: *servicio-python
    build: ./servicios/analitica
    hostname: analitica  # los ejecutores se conectan de vuelta al driver por este nombre
    networks: [interna, spark]
    environment:
      SERVICIO: analitica
      PUERTO: "8004"
      TZ: UTC
      LAGO_DIR: /datalake
      SPARK_MASTER: spark://spark-master:7077
      SPARK_EXECUTOR_MEMORY: 1536m
      SPARK_DRIVER_MEMORY: 1g
      SPARK_SHUFFLE_PARTICIONES: "16"
      SESION_URL: http://sesion:8002
    volumes:
      - ./datalake:/datalake:ro  # analítica solo lee el lago
    # Sin "condition": si Spark no está, la analítica arranca igual y /salud lo reporta.
    depends_on: [spark-master, spark-worker]

  # --- Bloque A (A1): mongo1, mongo2, mongo3 (replica set rs0) + mongo-init -------------
  mongo1: &mongo
    image: mongo:7.0
    hostname: mongo1
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    restart: unless-stopped
    networks: [interna]
    volumes:
      - mongo1:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo2:
    <<: *mongo
    hostname: mongo2
    volumes:
      - mongo2:/data/db

  mongo3:
    <<: *mongo
    hostname: mongo3
    volumes:
      - mongo3:/data/db

  # Inicia rs0 una sola vez (si ya existe no hace nada) y espera a que haya PRIMARY.
  mongo-init:
    image: mongo:7.0
    restart: "no"
    networks: [interna]
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    entrypoint: ["mongosh", "--quiet", "--host", "mongo1", "--eval"]
    command:
      - |
        try {
          rs.status();
          print("rs0 ya estaba iniciado");
        } catch (e) {
          if (e.codeName !== "NotYetInitialized") throw e;
          rs.initiate({ _id: "rs0", members: [
            { _id: 0, host: "mongo1:27017" },
            { _id: 1, host: "mongo2:27017" },
            { _id: 2, host: "mongo3:27017" }
          ] });
          print("rs0 iniciado");
        }
        for (let i = 0; i < 60; i++) {
          try {
            const p = rs.status().members.find(m => m.stateStr === "PRIMARY");
            if (p) { print("PRIMARY: " + p.name); quit(0); }
          } catch (e) {}
          sleep(1000);
        }
        print("sin PRIMARY despues de 60 s");
        quit(1);

  # Carga de datos (A5, perfil datos): borra y recarga la BD plataforma con el generador.
  #   docker compose --profile datos run --rm dataset
  dataset:
    build: ./dataset
    profiles: [datos]
    restart: "no"
    # Con el usuario del host, para que dataset/salida y evidence/ no queden a nombre de root.
    user: "${UID:-1000}:${GID:-1000}"
    networks: [interna]
    environment:
      MONGO_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0
      MONGO_DB: plataforma
    volumes:
      - ./dataset:/srv/dataset
      - ./evidence:/srv/evidence

  # --- Bloque B (B1): valkey con AOF everysec ------------------------------------------
  # --- Bloque C (C1): cola-eventos (Valkey Stream propio del historial, AOF),
  #                    spark-master, spark-worker, spark-worker-2 (perfil spark2) y
  #                    volumen del lago (rw solo en historial, ro en analitica/spark) -----
  # Cola durable de eventos (D3). Solo está en la red "cola", que comparte únicamente con historial.
  cola-eventos:
    image: valkey/valkey:8.0
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    restart: unless-stopped
    networks: [cola]
    volumes:
      - cola-eventos:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Spark standalone. Master y workers solo en la red "spark", que comparten con analitica.
  # Los workers montan el lago en la misma ruta que el driver (/datalake) y en solo lectura.
  spark-master:
    image: apache/spark:3.5.1-python3
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    restart: unless-stopped
    networks: [spark]
    environment:
      SPARK_NO_DAEMONIZE: "true"
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/7077"]
      interval: 5s
      timeout: 3s
      retries: 20

  spark-worker: &spark-worker
    image: apache/spark:3.5.1-python3
    hostname: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077", "--cores", "${SPARK_WORKER_CORES:-2}", "--memory", "${SPARK_WORKER_MEMORY:-2g}"]
    restart: unless-stopped
    networks: [spark]
    environment:
      SPARK_NO_DAEMONIZE: "true"
    volumes:
      - ./datalake:/datalake:ro
    depends_on: [spark-master]

  # Segundo worker para la comparación 1 vs 2 workers (P5):
  #   docker compose --profile spark2 up -d spark-worker-2 && docker compose restart analitica
  spark-worker-2:
    <<: *spark-worker
    hostname: spark-worker-2
    profiles: [spark2]

  # Histórico de eventos (C3, perfil datos): borra y regenera datalake/eventos (o eventos_grande).
  #   docker compose --profile datos run --rm dataset-historico
  #   docker compose --profile datos run --rm dataset-historico python -m dataset.historico.generar --conjunto grande
  #   docker compose --profile datos run --rm dataset-historico python -m dataset.historico.prueba
  # Es la carga desde cero del lago, como "dataset" lo es de MongoDB; en operación solo escribe historial.
  dataset-historico:
    build: ./dataset
    profiles: [datos]
    restart: "no"
    user: "${UID:-1000}:${GID:-1000}"
    network_mode: none  # no habla con ningún servicio: lee ids.json (o lo calcula) y escribe archivos
    command: ["python", "-m", "dataset.historico.generar"]
    environment:
      LAGO_DIR: /datalake
    volumes:
      - ./dataset:/srv/dataset
      - ./datalake:/datalake
      - ./evidence:/srv/evidence
  # --- Simulador (A6, perfil carga): solo en la red "borde" ----------------------------
  #   docker compose --profile carga run --rm simulador python -m simulador.simular --usuarios 10
  simulador:
    build: ./simulador
    profiles: [carga]
    restart: "no"
    user: "${UID:-1000}:${GID:-1000}"
    networks: [borde]  # solo ve al gateway (D12)
    environment:
      GATEWAY_URL: http://gateway:8000
      IDS_JSON: /srv/ids/ids.json
    volumes:
      - ./simulador:/srv/simulador
      - ./dataset/salida:/srv/ids:ro
      - ./evidence:/srv/evidence

networks:
  interna:
  borde:
  cola:   # historial <-> cola-eventos
  spark:  # analitica <-> spark-master/workers

volumes:
  mongo1:
  mongo2:
  mongo3:
  cola-eventos:
